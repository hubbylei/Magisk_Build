name: Update Checker

env:
  REPO_URL: https://github.com/topjohnwu/Magisk
  REPO_BRANCH: master

on:
  workflow_dispatch:
  schedule:
    - cron: 0 17 * * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Get Commit Hash
      id: getHash
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
        echo "commitHash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Compare Commit Hash
      id: compare
      run: |
        cacheVer=$(curl -skL https://raw.githubusercontent.com/hubbylei/Magisk-Files/refs/heads/master/HEAD)
        getVer=${{ steps.getHash.outputs.commitHash }}
        echo "CacheVer: ${cacheVer}"
        echo "getVer: ${getVer}"
        if [ "${cacheVer}" == "${getVer}" ];then
          echo "build=false" >> "$GITHUB_OUTPUT"
        else
          echo "build=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      if: steps.compare.outputs.build == 'true'
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.MAGISK_BUILD_CHECK }}
        event-type: Build_Magisk

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 3
